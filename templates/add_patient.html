{% extends "base.html" %}
{%block content%}
<h1>Add Patient</h1>

<form method="POST">
        <input type="text" name="name" placeholder="Enter your name" class="form-control mb-2" required>
        <input type="text" name="phone_number" placeholder="Please enter contact number" class="form-control mb-2" required>
        <input type="date" name="appointment_date" class="form-control mb-2" required>
        <button class="btn btn-primary">Add</button>

</form>

{%endblock%}
